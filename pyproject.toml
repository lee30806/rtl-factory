[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-factory"
version = "0.1.0"
description = "IR 기반 RTL 생성과 원본 RTL → IR·SPEC 변환"
requires-python = ">=3.11"
dependencies = [
    "pyslang==10.0.0",      # 구문 트리 API가 판마다 바뀌므로 고정
    "jsonschema>=4.26",
    "cocotb>=2.1,<3",       # Verilator 5.052와 함께 확인
]

[project.optional-dependencies]
# SPEC 입력: PDF 그림·WaveJSON 추출, 레지스터 맵 xlsx
spec = [
    "pymupdf>=1.28",
    "openpyxl>=3.1",
]
# tests/golden 원본 테스트벤치
golden = [
    "cocotb-test>=0.3",
    "cocotbext-axi>=0.1.28",
    "cocotbext-uart>=0.1.4",
]
dev = [
    "rtl-factory[spec,golden]",
    "pytest>=9.1",
]

[project.scripts]
rtlf = "pipeline.cli:main"   # schema, config, 예시 IR을 저장소에서 찾으므로 editable 설치(pip install -e .)로 쓴다

[tool.setuptools.packages.find]
include = ["pipeline*"]
